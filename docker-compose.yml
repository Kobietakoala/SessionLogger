services:
  frontend:
    build:
      context: .
      dockerfile: config/Dockerfile.frontend
    container_name: sessionlogger-frontend
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ../config/Dockerfile.backend
    container_name: sessionlogger-backend
    restart: unless-stopped
    ports:
      - "5000:5000" 
    volumes:
      - db_data:/app/db 
    environment:
      - PORT=5000

  nginx:
    image: nginx:alpine
    container_name: sessionlogger-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data: {}
